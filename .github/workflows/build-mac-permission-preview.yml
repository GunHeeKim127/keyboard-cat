name: Build Mac permission recovery preview
on:
  push:
    branches: ['codex/mac-permission-continuity']
    paths: ['.github/workflows/build-mac-permission-preview.yml']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            app: release/mac-arm64/Keyboard Cat.app
          - os: macos-15-intel
            arch: x64
            app: release/mac/Keyboard Cat.app
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=low --registry=https://registry.npmjs.org
      - run: npm run build
      - run: npm test
      - run: npx --no-install electron-builder --mac dir --${{ matrix.arch }} --publish never
      - run: node scripts/run-packaged-smoke.cjs "${{ matrix.app }}"
      - run: node scripts/run-interaction-smoke.cjs "${{ matrix.app }}"
      - name: Export app for local signing (no signing credentials on runner)
        env:
          APP: ${{ matrix.app }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p work/permission-preview-input
          ditto -c -k --sequesterRsrc --keepParent "$APP" "work/permission-preview-input/Keyboard-Cat-permission-preview2-$ARCH.zip"
          shasum -a 256 "work/permission-preview-input/Keyboard-Cat-permission-preview2-$ARCH.zip"
          printf '%s\n' "$GITHUB_SHA" > work/permission-preview-input/source-commit.txt
      - uses: actions/upload-artifact@v6
        with:
          name: permission-preview2-input-${{ matrix.arch }}
          path: work/permission-preview-input/
          compression-level: 0
          retention-days: 14
