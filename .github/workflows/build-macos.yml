name: Build macOS
run-name: macOS - ${{ github.sha }}
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-macos.yml'
      - 'electron/**'
      - 'native/**'
      - 'scripts/**'
      - 'src/**'
      - 'public/**'
      - 'build/**'
      - 'tests/**'
      - 'package*.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - 'index.html'
permissions:
  contents: read
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v5
      - name: Show build revision
        run: |
          echo "Building commit: $GITHUB_SHA"
          git log -1 --oneline
          uname -m
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: node scripts/check-native.cjs
      - name: Verify universal input helper
        run: node scripts/check-mac-helper.cjs
      - name: Build DMG and ZIP for both architectures
        run: npx --no-install electron-builder --mac dmg zip --arm64 --x64 --publish never
      - name: Check packaged helper and application
        run: node scripts/check-mac-package.cjs
      - uses: actions/upload-artifact@v6
        with:
          name: keyboard-cat-macos-AppleSilicon-DMG
          path: release/*-mac-arm64.dmg
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v6
        with:
          name: keyboard-cat-macos-Intel-DMG
          path: release/*-mac-x64.dmg
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
