name: Build macOS
run-name: macOS ${{ inputs.signed && 'Notarized' || 'Unnotarized' }} - ${{ github.sha }}
on:
  workflow_dispatch:
    inputs:
      signed:
        description: 'Developer ID signing and Apple notarization (requires repository secrets)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-macos.yml'
      - 'electron/**'
      - 'native/**'
      - 'scripts/**'
      - 'src/**'
      - 'public/**'
      - 'build/**'
      - 'tests/**'
      - 'package*.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - 'index.html'
permissions:
  contents: read
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v5
      - name: Show build revision
        run: |
          echo "Building commit: $GITHUB_SHA"
          git log -1 --oneline
          uname -m
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: node scripts/check-native.cjs
      - name: Verify universal input helper
        run: node scripts/check-mac-helper.cjs
      - name: Build DMG and ZIP for both architectures
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.signed }}
        run: npx --no-install electron-builder --mac dmg zip --arm64 --x64 --publish never
      - name: Build signed and notarized distribution
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.signed }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx --no-install electron-builder --config build/mac-distribution.cjs --mac dmg zip --arm64 --x64 --publish never
      - name: Check packaged helper and application
        run: node scripts/check-mac-package.cjs
      - name: Verify Developer ID and Apple notarization
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.signed }}
        run: node scripts/check-mac-distribution.cjs
      - name: Keep only the current version's installers
        run: node scripts/clean-old-releases.cjs mac
      - uses: actions/upload-artifact@v6
        with:
          name: keyboard-cat-macos-AppleSilicon-DMG-${{ inputs.signed && 'Notarized' || 'Unnotarized' }}
          path: release/*-mac-arm64.dmg
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v6
        with:
          name: keyboard-cat-macos-Intel-DMG-${{ inputs.signed && 'Notarized' || 'Unnotarized' }}
          path: release/*-mac-x64.dmg
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
