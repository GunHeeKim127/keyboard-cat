name: Verify Mac permission recovery preview 2
on:
  push:
    branches: ['codex/mac-permission-continuity']
    paths: ['.github/workflows/verify-mac-permission-preview2.yml']
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            sha256: 32cd96009ab6309b5a95fd0221800bf87abcff902d6c151d0a36fb651c40ef04
          - os: macos-15-intel
            arch: x64
            sha256: 147e271e424be1818a05b9bc90665c8fe878581be6db99c7f5dee6912af223e4
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: npm ci
      - name: Download public trial payload without repository write access
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p work
          curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' "https://github.com/GunHeeKim127/keyboard-cat/releases/download/mac-fixed-identity-preview-2/Keyboard-Cat-2.5.2-permission-preview2-$ARCH.tar.gz" -o work/fixed-preview.tar.gz
      - name: Verify and package
        env:
          ARCH: ${{ matrix.arch }}
          EXPECTED_HASH: ${{ matrix.sha256 }}
        run: python scripts/verify-local-mac-signature.py work/fixed-preview.tar.gz "$EXPECTED_HASH" AE37A9663433A2C80338B686DB8180EB6FDF4082 --package-label "Keyboard-Cat-2.5.2-permission-preview2-$ARCH" --dmg-only
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: permission-preview2-delivery-${{ matrix.arch }}
          path: |
            work/local-signature-native-report.json
            work/launcher-reports/
            work/verified-mac-preview/*.dmg
          if-no-files-found: warn
          compression-level: 0
