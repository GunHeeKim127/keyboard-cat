name: Verify Mac signing continuity
on:
  push:
    branches: ['codex/mac-permission-continuity']
    paths: ['scripts/check-mac-signing-continuity.cjs', 'scripts/sign-mac-continuity.cjs', 'build/mac-continuity.cjs', '.github/workflows/verify-mac-signing-continuity.yml', 'electron/input-monitor.ts', 'electron/input-diagnostics.ts', 'electron/main.ts', 'tests/input-monitor.test.cjs', 'tests/input-diagnostics.test.cjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identity:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm ci
      - run: node scripts/check-mac-signing-continuity.cjs --package
      - run: npm test
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mac-signing-continuity-${{ matrix.os }}
          path: |
            work/mac-signing-reports/
            work/launcher-reports/
          if-no-files-found: warn
